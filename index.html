const questions=[{"n": 1, "level": "Nhận biết", "q": "Số hữu tỉ là số được viết dưới dạng phân số a/b với:", "opts": ["a, b ∈ ℕ, b ≠ 0.", "a, b ∈ ℤ, b ≠ 0.", "a, b ∈ ℤ.", "a ∈ ℕ, b ∈ ℤ."], "ans": 1, "exp": "Số hữu tỉ là số viết được dưới dạng phân số a/b với a, b ∈ ℤ, b ≠ 0."}, {"n": 2, "level": "Nhận biết", "q": "Tập hợp các số hữu tỉ được kí hiệu là:", "opts": ["ℕ.", "ℤ.", "ℚ.", "ℝ."], "ans": 2, "exp": "Tập hợp các số hữu tỉ được kí hiệu là ℚ."}, {"n": 3, "level": "Nhận biết", "q": "Số đối của số hữu tỉ -3/5 là:", "opts": ["3/5.", "5/3.", "-5/3.", "-3/5."], "ans": 0, "exp": "Số đối của a/b là -a/b, do đó số đối của -3/5 là 3/5."}, {"n": 4, "level": "Nhận biết", "q": "Khẳng định nào sau đây là ĐÚNG?", "opts": ["Số 0 là số hữu tỉ dương.", "Số 0 là số hữu tỉ âm.", "Số 0 không là số hữu tỉ dương, cũng không là số hữu tỉ âm.", "Số 0 không phải là số hữu tỉ."], "ans": 2, "exp": "Số 0 nằm giữa số hữu tỉ dương và số hữu tỉ âm, không thuộc nhóm dương cũng không thuộc nhóm âm."}, {"n": 5, "level": "Nhận biết", "q": "Trong các số sau, số nào là số hữu tỉ dương?", "opts": ["-2/3.", "(-4)/(-5).", "0/7.", "-1,5."], "ans": 1, "exp": "(-4)/(-5) = 4/5 > 0 nên là số hữu tỉ dương."}, {"n": 6, "level": "Nhận biết", "q": "Điểm biểu diễn số hữu tỉ -1/2 trên trục số nằm ở vị trí nào so với gốc 0?", "opts": ["Bên phải gốc 0 và cách gốc 0 một khoảng 1 đơn vị.", "Bên trái gốc 0 và cách gốc 0 một khoảng 1/2 đơn vị.", "Bên phải gốc 0 và cách gốc 0 một khoảng 1/2 đơn vị.", "Trùng với gốc 0."], "ans": 1, "exp": "Điểm -1/2 nằm bên trái gốc 0 và cách gốc 0 một khoảng bằng 1/2 đơn vị."}, {"n": 7, "level": "Nhận biết", "q": "Với x ∈ ℚ, x ≠ 0 và m, n ∈ ℕ, công thức nhân hai lũy thừa cùng cơ số là:", "opts": ["xᵐ · xⁿ = xᵐ⁺ⁿ.", "xᵐ · xⁿ = xᵐⁿ.", "xᵐ · xⁿ = xᵐ⁻ⁿ.", "xᵐ · xⁿ = (x·x)ᵐ⁺ⁿ."], "ans": 0, "exp": "Công thức nhân hai lũy thừa cùng cơ số: xᵐ · xⁿ = xᵐ⁺ⁿ."}, {"n": 8, "level": "Nhận biết", "q": "Với x ∈ ℚ, x ≠ 0, quy ước x⁰ bằng:", "opts": ["0.", "1.", "x.", "-1."], "ans": 1, "exp": "Quy ước x⁰ = 1 với mọi x ≠ 0."}, {"n": 9, "level": "Nhận biết", "q": "Kết quả của phép tính (-2/3)² bằng:", "opts": ["-4/9.", "4/9.", "-4/6.", "2/9."], "ans": 1, "exp": "(-2/3)² = (-2)² / 3² = 4/9."}, {"n": 10, "level": "Nhận biết", "q": "Khi chuyển một số hạng từ vế này sang vế kia của một đẳng thức, ta phải:", "opts": ["Giữ nguyên dấu của số hạng đó.", "Đổi dấu số hạng đó.", "Nhân số hạng đó với -1.", "Chia số hạng đó cho 2."], "ans": 1, "exp": "Theo quy tắc chuyển vế: Khi chuyển một số hạng từ vế này sang vế kia, ta phải đổi dấu số hạng đó."}, {"n": 11, "level": "Nhận biết", "q": "Cho đẳng thức x + a = b. Khi áp dụng quy tắc chuyển vế, ta tìm được x là:", "opts": ["x = b + a.", "x = b - a.", "x = a - b.", "x = -b - a."], "ans": 1, "exp": "x + a = b ⇒ x = b - a."}, {"n": 12, "level": "Nhận biết", "q": "Cho x, y ∈ ℚ và n ∈ ℕ*. Công thức lũy thừa của một tích là:", "opts": ["(x · y)ⁿ = xⁿ + yⁿ.", "(x · y)ⁿ = xⁿ · yⁿ.", "(x · y)ⁿ = xⁿ : yⁿ.", "(x · y)ⁿ = x · yⁿ."], "ans": 1, "exp": "Công thức lũy thừa của một tích: (x · y)ⁿ = xⁿ · yⁿ."}, {"n": 13, "level": "Nhận biết", "q": "Cách viết nào sau đây thể hiện đúng một số hữu tỉ âm?", "opts": ["3/4.", "(-5)/(-7).", "-2/5.", "0/(-3)."], "ans": 2, "exp": "-2/5 có tử âm, mẫu dương nên là số hữu tỉ âm."}, {"n": 14, "level": "Nhận biết", "q": "Phân số nào sau đây biểu diễn số hữu tỉ 0,75?", "opts": ["3/4.", "7/5.", "4/3.", "75/10."], "ans": 0, "exp": "0,75 = 75/100 = 3/4."}, {"n": 15, "level": "Nhận biết", "q": "Cho biểu thức chỉ gồm phép cộng và phép trừ không có dấu ngoặc, thứ tự thực hiện phép tính là:", "opts": ["Thực hiện từ phải sang trái.", "Thực hiện phép cộng trước, phép trừ sau.", "Thực hiện từ trái sang phải.", "Thực hiện phép trừ trước, phép cộng sau."], "ans": 2, "exp": "Biểu thức chỉ có phép cộng và trừ thì thực hiện lần lượt từ trái sang phải."}, {"n": 16, "level": "Nhận biết", "q": "Cho biểu thức không có dấu ngoặc gồm các phép tính: Lũy thừa, Nhân, Chia, Cộng, Trừ. Thứ tự thực hiện phép tính ĐÚNG là:", "opts": ["Nhân và chia → Lũy thừa → Cộng và trừ.", "Lũy thừa → Nhân và chia → Cộng và trừ.", "Cộng và trừ → Nhân và chia → Lũy thừa.", "Lũy thừa → Cộng và trừ → Nhân và chia."], "ans": 1, "exp": "Thứ tự ưu tiên thực hiện phép tính: Lũy thừa → Nhân và chia → Cộng và trừ."}, {"n": 17, "level": "Nhận biết", "q": "Kết quả phép tính (xᵐ)ⁿ bằng:", "opts": ["xᵐ⁺ⁿ.", "xᵐ⁻ⁿ.", "xᵐⁿ.", "xᵐⁿ."], "ans": 2, "exp": "Công thức lũy thừa của lũy thừa: (xᵐ)ⁿ = xᵐⁿ."}, {"n": 18, "level": "Nhận biết", "q": "Số đối của số 0 là:", "opts": ["1.", "-1.", "0.", "Không có số đối."], "ans": 2, "exp": "Số đối của 0 chính là 0."}, {"n": 19, "level": "Nhận biết", "q": "Khẳng định nào sau đây là ĐÚNG khi bỏ dấu ngoặc có dấu '-' đằng trước: -(a - b + c)?", "opts": ["-a + b - c.", "-a - b + c.", "-a + b + c.", "a - b + c."], "ans": 0, "exp": "-(a - b + c) = -a + b - c."}, {"n": 20, "level": "Nhận biết", "q": "Số hữu tỉ -7/10 viết dưới dạng số thập phân là:", "opts": ["-7,0.", "-0,7.", "-0,07.", "0,7."], "ans": 1, "exp": "-7/10 = -0,7."}, {"n": 21, "level": "Thông hiểu", "q": "So sánh hai số hữu tỉ x = -3/5 và y = -4/5.", "opts": ["x < y.", "x > y.", "x = y.", "Không so sánh được."], "ans": 1, "exp": "Vì -3 > -4 nên -3/5 > -4/5 hay x > y."}, {"n": 22, "level": "Thông hiểu", "q": "Tính giá trị của biểu thức A = 1/3 + (-2/5).", "opts": ["-1/15.", "1/15.", "-1/2.", "11/15."], "ans": 0, "exp": "A = 1/3 - 2/5 = 5/15 - 6/15 = -1/15."}, {"n": 23, "level": "Thông hiểu", "q": "Kết quả phép tính 3/4 · (-8/9) là:", "opts": ["-2/3.", "2/3.", "-1/3.", "-27/32."], "ans": 0, "exp": "3/4 · (-8/9) = (3 · (-8)) / (4 · 9) = -24/36 = -2/3."}, {"n": 24, "level": "Thông hiểu", "q": "Tìm x, biết x - 1/2 = -1/3.", "opts": ["x = 1/6.", "x = -5/6.", "x = -1/6.", "x = 5/6."], "ans": 0, "exp": "x = -1/3 + 1/2 = -2/6 + 3/6 = 1/6."}, {"n": 25, "level": "Thông hiểu", "q": "Giá trị của biểu thức B = (-1/2)³ : (-1/2) bằng:", "opts": ["1/4.", "-1/4.", "1/8.", "-1/8."], "ans": 0, "exp": "B = (-1/2)³⁻¹ = (-1/2)² = 1/4."}, {"n": 26, "level": "Thông hiểu", "q": "Sắp xếp các số hữu tỉ sau theo thứ tự tăng dần: -0,5; 1/2; 0; -3/2.", "opts": ["-3/2 < -0,5 < 0 < 1/2.", "-0,5 < -3/2 < 0 < 1/2.", "0 < -0,5 < -3/2 < 1/2.", "1/2 < 0 < -0,5 < -3/2."], "ans": 0, "exp": "Ta có -3/2 = -1,5 < -0,5 < 0 < 1/2."}, {"n": 27, "level": "Thông hiểu", "q": "Quan sát trục số ở hình vẽ bên. Điểm A và điểm B lần lượt biểu diễn các số hữu tỉ nào?", "opts": ["A = -0,5; B = 0,5.", "A = -1; B = 1.", "A = -0,25; B = 0,75.", "A = -0,5; B = 0,25."], "ans": 0, "exp": "Từ trục số, A nằm giữa 0 và -1 nên A = -0,5; B nằm giữa 0 và 1 nên B = 0,5."}, {"n": 28, "level": "Thông hiểu", "q": "Kết quả phép tính (-5/7) : (10/21) là:", "opts": ["-3/2.", "3/2.", "-50/147.", "-2/3."], "ans": 0, "exp": "(-5/7) : (10/21) = (-5/7) · (21/10) = (-5·21)/(7·10) = -105/70 = -3/2."}, {"n": 29, "level": "Thông hiểu", "q": "Viết tích 8² · 4³ dưới dạng lũy thừa của cơ số 2.", "opts": ["2¹².", "2¹⁰.", "2⁵.", "2²⁴."], "ans": 0, "exp": "8² · 4³ = (2³)² · (2²)³ = 2⁶ · 2⁶ = 2¹²."}, {"n": 30, "level": "Thông hiểu", "q": "Kết quả rút gọn biểu thức C = (3/5 - 1/2) · (10/3) là:", "opts": ["1/3.", "2/3.", "1.", "-1/3."], "ans": 0, "exp": "C = (6/10 - 5/10) · (10/3) = (1/10) · (10/3) = 1/3."}, {"n": 31, "level": "Thông hiểu", "q": "Tìm số tự nhiên n thỏa mãn 3ⁿ = 81.", "opts": ["n = 3.", "n = 4.", "n = 5.", "n = 27."], "ans": 1, "exp": "3ⁿ = 81 = 3⁴ ⇒ n = 4."}, {"n": 32, "level": "Thông hiểu", "q": "Cho x + (-2/3) = 1/6. Giá trị của x là:", "opts": ["5/6.", "-1/2.", "1/2.", "-5/6."], "ans": 0, "exp": "x = 1/6 - (-2/3) = 1/6 + 4/6 = 5/6."}, {"n": 33, "level": "Thông hiểu", "q": "Giá trị của biểu thức D = -(3,1 - 2,5) + (-2,5 + 3,1) là:", "opts": ["0.", "1,2.", "-1,2.", "6,2."], "ans": 0, "exp": "D = -0,6 + 0,6 = 0."}, {"n": 34, "level": "Thông hiểu", "q": "Trục số bên biểu diễn điểm M (-3/4) và điểm N (1/2). Khoảng cách giữa hai điểm M và N là:", "opts": ["5/4.", "1/4.", "-5/4.", "3/8."], "ans": 0, "exp": "Khoảng cách d = |1/2 - (-3/4)| = |2/4 + 3/4| = 5/4."}, {"n": 35, "level": "Thông hiểu", "q": "Khẳng định nào sau đây SAI khi so sánh lũy thừa?", "opts": ["2³⁰ = (2³)¹⁰ = 8¹⁰.", "3²⁰ = (3²)¹⁰ = 9¹⁰.", "2³⁰ > 3²⁰.", "(-2)⁴ = 16."], "ans": 2, "exp": "2³⁰ = 8¹⁰ và 3²⁰ = 9¹⁰. Vì 8 < 9 nên 8¹⁰ < 9¹⁰ ⇒ 2³⁰ < 3²⁰. Vậy khẳng định '2³⁰ > 3²⁰' là SAI."}, {"n": 36, "level": "Vận dụng", "q": "Tính giá trị biểu thức A = (5/9)·(7/13) + (5/9)·(6/13) - (5/9).", "opts": ["0.", "5/9.", "1.", "-5/9."], "ans": 0, "exp": "A = (5/9) · (7/13 + 6/13 - 1) = (5/9) · (1 - 1) = 0."}, {"n": 37, "level": "Vận dụng", "q": "Tìm x, biết (2/3)x - 1/2 = 1/6.", "opts": ["x = 1.", "x = 1/2.", "x = 4/9.", "x = -1/2."], "ans": 0, "exp": "(2/3)x = 1/6 + 1/2 = 2/3 ⇒ x = 1."}, {"n": 38, "level": "Vận dụng", "q": "Quan sát cân đĩa thăng bằng ở hình bên. Đẳng thức mô tả tình trạng cân thăng bằng để tìm khối lượng quả bí x (kg) là:", "opts": ["x + 1,8 = 1,5 + 2,5 ⇒ x = 2,2 kg.", "x - 1,8 = 1,5 + 2,5.", "x + 1,8 = 2,5.", "x = 1,8 + 1,5 + 2,5."], "ans": 0, "exp": "Đẳng thức cân thăng bằng: x + 1,8 = 1,5 + 2,5 ⇒ x = 4 - 1,8 = 2,2 kg."}, {"n": 39, "level": "Vận dụng", "q": "Để làm 24 cái bánh, An cần 1¾ cốc bột mì. Hỏi nếu An muốn làm 8 cái bánh thì cần bao nhiêu cốc bột mì?", "opts": ["7/12 cốc.", "7/8 cốc.", "1/3 cốc.", "21/4 cốc."], "ans": 0, "exp": "1¾ = 7/4 cốc. 8 cái bánh cần: (7/4) · (8 / 24) = (7/4) · (1/3) = 7/12 cốc bột mì."}, {"n": 40, "level": "Vận dụng", "q": "Quan sát sơ đồ bên. Một tàu ngầm ở vị trí -120,5m và một máy bay ở độ cao +250,5m so với mực nước biển. Khoảng cách thẳng đứng giữa máy bay và tàu ngầm là:", "opts": ["371m.", "130m.", "-371m.", "250,5m."], "ans": 0, "exp": "Khoảng cách h = 250,5 - (-120,5) = 250,5 + 120,5 = 371m."}, {"n": 41, "level": "Vận dụng", "q": "Mẹ Lan mua 2,5kg cam giá 30 000 đ/kg và 1,5kg táo giá 50 000 đ/kg. Mẹ Lan đưa thu ngân tờ 200 000 đ. Số tiền thừa nhận lại là:", "opts": ["50 000 đồng.", "40 000 đồng.", "60 000 đồng.", "150 000 đồng."], "ans": 0, "exp": "Tổng tiền mua hàng: 2,5 · 30 000 + 1,5 · 50 000 = 75 000 + 75 000 = 150 000 đ. Tiền thừa: 200 000 - 150 000 = 50 000 đ."}, {"n": 42, "level": "Vận dụng", "q": "Tìm x, biết (x - 1/3)² = 4/9.", "opts": ["x = 1 hoặc x = -1/3.", "x = 1.", "x = -1/3.", "x = 5/3 hoặc x = -1."], "ans": 0, "exp": "(x - 1/3)² = (2/3)² ⇒ TH1: x - 1/3 = 2/3 ⇒ x = 1; TH2: x - 1/3 = -2/3 ⇒ x = -1/3."}, {"n": 43, "level": "Vận dụng", "q": "Tính giá trị biểu thức P = (27¹⁰ + 9⁵) / (9¹³ + 27²).", "opts": ["81.", "9.", "27.", "3."], "ans": 0, "exp": "P = (3³⁰ + 3¹⁰) / (3²⁶ + 3⁶) = [3¹⁰(3²⁰ + 1)] / [3⁶(3²⁰ + 1)] = 3¹⁰ / 3⁶ = 3⁴ = 81."}, {"n": 44, "level": "Vận dụng", "q": "Cửa hàng niêm yết giá bánh pizza: Cỡ to $11,5; cỡ trung bình $8,75; cỡ nhỏ $6,25. Phillip mua 3 bánh to, 2 bánh trung bình, 1 bánh nhỏ và đưa $100. Số tiền người bán trả lại là:", "opts": ["$41,75.", "$58,25.", "$42,25.", "$38,75."], "ans": 0, "exp": "Tổng tiền mua pizza: 3 · 11,5 + 2 · 8,75 + 1 · 6,25 = 34,5 + 17,5 + 6,25 = $58,25. Tiền trả lại: 100 - 58,25 = $41,75."}, {"n": 45, "level": "Vận dụng", "q": "Cho A = 2² + 4² + 6² + ... + 18². Biết 1² + 2² + 3² + ... + 9² = 285. Giá trị của A là:", "opts": ["1140.", "570.", "2280.", "855."], "ans": 0, "exp": "A = 2²(1² + 2² + 3² + ... + 9²) = 4 · 285 = 1140."}, {"n": 46, "level": "Vận dụng cao", "q": "Tìm giá trị nhỏ nhất của biểu thức M = (x - 2/5)² + 3/7.", "opts": ["3/7 đạt được khi x = 2/5.", "2/5 đạt được khi x = 3/7.", "0.", "29/35."], "ans": 0, "exp": "Vì (x - 2/5)² ≥ 0 với mọi x, nên M ≥ 3/7. Dấu '=' xảy ra khi x = 2/5."}, {"n": 47, "level": "Vận dụng cao", "q": "Tìm số tự nhiên n, biết 5ⁿ · (1/5)³ = 125.", "opts": ["n = 6.", "n = 3.", "n = 0.", "n = 5."], "ans": 0, "exp": "5ⁿ · 5⁻³ = 5³ ⇒ 5ⁿ⁻³ = 5³ ⇒ n - 3 = 3 ⇒ n = 6."}, {"n": 48, "level": "Vận dụng cao", "q": "Cho S = 1/(1·2) + 1/(2·3) + 1/(3·4) + ... + 1/(99·100). Giá trị của S là:", "opts": ["99/100.", "1/100.", "100/99.", "98/100."], "ans": 0, "exp": "S = (1 - 1/2) + (1/2 - 1/3) + ... + (1/99 - 1/100) = 1 - 1/100 = 99/100."}, {"n": 49, "level": "Vận dụng cao", "q": "Tìm tất cả các số nguyên x để P = (x + 5)/(x + 2) nhận giá trị nguyên.", "opts": ["x ∈ {-5, -3, -1, 1}.", "x ∈ {-1, -3, 1, -5}.", "x ∈ {1, 2, 3, 5}.", "x ∈ {-2, 0, 2}."], "ans": 1, "exp": "P = (x + 2 + 3)/(x + 2) = 1 + 3/(x + 2). P nguyên ⇔ x + 2 ∈ Ư(3) = {1, -1, 3, -3} ⇒ x ∈ {-1, -3, 1, -5}."}, {"n": 50, "level": "Vận dụng cao", "q": "Cho A = (25⁶ + 5⁴) / (25⁵ + 25). Khẳng định nào sau đây ĐÚNG về A?", "opts": ["A = 25.", "A = 5.", "A = 125.", "A = 1."], "ans": 0, "exp": "A = (5¹² + 5⁴) / (5¹⁰ + 5²) = [5⁴(5⁸ + 1)] / [5²(5⁸ + 1)] = 5⁴ / 5² = 5² = 25."}];
const form=document.getElementById('quiz');
let submitted=false,time=3600;
function render(){
  form.innerHTML=questions.map((x,i)=>`<section class="card" id="q${i}">
    <div class="qhead"><span class="num">Câu ${x.n}</span><span class="level">${x.level}</span></div>
    <div class="question">${x.q}</div>
    ${x.opts.map((o,j)=>`<label class="option" id="o${i}_${j}"><input type="radio" name="q${i}" value="${j}"><b>${String.fromCharCode(65+j)}.</b> ${o}</label>`).join('')}
  </section>`).join('');
  document.querySelectorAll('input[type=radio]').forEach(e=>e.addEventListener('change',updateProgress));
}
function updateProgress(){
 const n=document.querySelectorAll('input[type=radio]:checked').length;
 document.getElementById('count').textContent=`Đã trả lời: ${n}/${questions.length}`;
 document.getElementById('fill').style.width=(n/questions.length*100)+'%';
}
function finish(auto=false){
 if(submitted)return;
 const name=document.getElementById('name').value.trim();
 if(!auto&&!name){alert('Vui lòng nhập Họ và tên học sinh trước khi nộp bài.');return}
 submitted=true;
 let correct=0,answered=0;
 const review=[];
 questions.forEach((x,i)=>{
   const sel=document.querySelector(`input[name=q${i}]:checked`);
   if(sel){answered++; if(+sel.value===x.ans)correct++;}
   x.opts.forEach((_,j)=>document.getElementById(`o${i}_${j}`).classList.remove('correct','wrong'));
   document.getElementById(`o${i}_${x.ans}`).classList.add('correct');
   if(sel && +sel.value!==x.ans)document.getElementById(`o${i}_${+sel.value}`).classList.add('wrong');
   review.push(`<div class="r"><b>Câu ${x.n}:</b> ${sel?`Em chọn <span class="${+sel.value===x.ans?'ok':'bad'}">${String.fromCharCode(65,+sel.value)}</span>`:'<span class="bad">Chưa trả lời</span>'}. Đáp án đúng: <span class="ok">${String.fromCharCode(65+x.ans)}</span><br><small>${x.exp}</small></div>`);
 });
 document.querySelectorAll('input[type=radio]').forEach(e=>e.disabled=true);
 document.getElementById('score').innerHTML=`${correct}/${questions.length} câu đúng — Điểm: <strong>${(correct/5).toFixed(2)}/10</strong>`;
 document.getElementById('answeredFinal').textContent=`Số câu đã trả lời: ${answered}/${questions.length}`;
 document.getElementById('review').innerHTML=review.join('');
 document.getElementById('result').style.display='block';
 document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
function tick(){
 const m=Math.floor(time/60),s=time%60;
 document.getElementById('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
 if(time<=0){clearInterval(clock);finish(true);alert('Hết giờ! Bài làm đã được tự động nộp.');}
 time--;
}
render();tick();const clock=setInterval(tick,1000);
document.getElementById('submit').onclick=()=>finish(false);
document.getElementById('reset').onclick=()=>location.reload();
</script></body></html>
